---
version: "3"

vars:
  PROJECT: pvectl
  MODULE: github.com/stuttgart-things/pvectl
  BIN_DIR: ./bin
  SECRETS: ~/.secrets.d/labul/proxmox.env

includes:
  git:
    taskfile: https://raw.githubusercontent.com/stuttgart-things/tasks/refs/heads/main/git/git.yaml
  lint:
    taskfile: https://raw.githubusercontent.com/stuttgart-things/tasks/refs/heads/main/git/linting.yaml
  goLint:
    taskfile: https://raw.githubusercontent.com/stuttgart-things/tasks/refs/heads/main/go/lint.yaml
  goBuild:
    taskfile: https://raw.githubusercontent.com/stuttgart-things/tasks/refs/heads/main/go/build.yaml

tasks:
  do:
    desc: Select a task to run
    cmds:
      - |
        task_name=$(task -l | awk '/^\*/ {print $2}' | sed 's/:$//' | gum choose)
        [ -n "$task_name" ] && task "$task_name"

  test:
    desc: Run the unit tests in Dagger (the dev sandbox breaks the Go linker for go test)
    cmds:
      - dagger -m github.com/stuttgart-things/dagger/go call test --src . --test-arg ./...

  build:
    desc: Build binary using Dagger with ldflags
    vars:
      VERSION:
        sh: git describe --tags --abbrev=0 2>/dev/null || echo "0.0.1"
      OS: '{{.OS | default "linux"}}'
      ARCH: '{{.ARCH | default "amd64"}}'
      OUTPUT_PATH: '{{.OUTPUT_PATH | default "/tmp/go/build/"}}'
    cmds:
      - task: goBuild:build
        vars:
          SRC: .
          GO_VERSION: "1.27.3"
          OS: "{{ .OS }}"
          ARCH: "{{ .ARCH }}"
          PACKAGE_NAME: "{{ .MODULE }}"
          LDFLAGS: "cmd.version={{ .VERSION }}; cmd.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ); cmd.commit=$(git rev-parse --short HEAD 2>/dev/null || echo 'none')"
          GO_MAIN_FILE: main.go
          BIN_NAME: "{{ .PROJECT }}"
          OUTPUT_PATH: "{{ .OUTPUT_PATH }}"

  build-local:
    desc: Build ./bin/pvectl with version, commit and build date set via ldflags (no Dagger)
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo dev
      COMMIT:
        sh: git rev-parse --short HEAD 2>/dev/null || true
      DATE:
        sh: date -u +%Y-%m-%dT%H:%M:%SZ
      PKG: github.com/stuttgart-things/pvectl/cmd
    cmds:
      - mkdir -p {{ .BIN_DIR }}
      - >-
        go build -trimpath
        -ldflags "-s -w
        -X {{ .PKG }}.version={{ .VERSION }}
        -X {{ .PKG }}.commit={{ .COMMIT }}
        -X {{ .PKG }}.buildDate={{ .DATE }}"
        -o {{ .BIN_DIR }}/{{ .PROJECT }} .
      - "{{ .BIN_DIR }}/{{ .PROJECT }} version"

  install-local:
    desc: build-local and install the binary to ~/.local/bin
    cmds:
      - task: build-local
      - install -m 0755 {{ .BIN_DIR }}/{{ .PROJECT }} ${HOME}/.local/bin/{{ .PROJECT }}

  smoke:
    desc: Read-only smoke test against LabUL (templates, config 280, recent tasks)
    cmds:
      - sops exec-env {{ .SECRETS }} '{{ .BIN_DIR }}/{{ .PROJECT }} --insecure vms --templates ubuntu26'
      - sops exec-env {{ .SECRETS }} '{{ .BIN_DIR }}/{{ .PROJECT }} --insecure config 280'
      - sops exec-env {{ .SECRETS }} '{{ .BIN_DIR }}/{{ .PROJECT }} --insecure tasks --limit 10'

  release-check:
    desc: Dry-run GoReleaser via Dagger (releases come from the Release workflow only)
    cmds:
      - task: goBuild:release
        vars:
          SRC: .
          CHECK_ONLY: "true"
          OUTPUT_PATH: /tmp/pvectl/goreleaser.log
          RELEASER_VERSION: v2.13.3

  trigger-release:
    desc: Trigger Release workflow on GitHub Actions
    cmds:
      - |
        gh workflow run Release
        sleep 2
        RUN_ID=$(gh run list --workflow=Release --limit=1 --json databaseId --jq '.[0].databaseId')
        echo "Run: https://github.com/stuttgart-things/{{ .PROJECT }}/actions/runs/${RUN_ID}"
        gh run watch "${RUN_ID}"
